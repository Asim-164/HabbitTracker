<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar — HabbitTracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app">

    <aside class="app__sidebar">
        <div class="app__brand">HabbitTracker</div>

        <nav class="app__nav">
            <a href="/pages/dashboard.html" class="app__nav-item">Dashboard</a>
            <a href="/pages/habits.html" class="app__nav-item">My Habits</a>
            <a href="/pages/tracking.html" class="app__nav-item">Daily Tracking</a>
            <a href="/pages/calendar.html" class="app__nav-item is-active">Calendar</a>
            <a href="/pages/statistics.html" class="app__nav-item">Statistics</a>
            <a href="/pages/reflections.html" class="app__nav-item">Reflections</a>
            <a href="/pages/settings.html" class="app__nav-item">Settings</a>
        </nav>

        <button type="button" class="app__logout" id="logout-btn">Logout</button>
    </aside>

    <main class="app__main">
        <header class="app__header">
            <h1 class="app__page-title">Calendar</h1>
            <div class="app__user" id="user-name">—</div>
        </header>

        <div class="app__content">
            <div class="cal__head">
                <label class="cal__picker">
                    <span class="muted small">Habit</span>
                    <select id="habit-select"></select>
                </label>

                <div class="cal__nav">
                    <button type="button" class="btn-secondary" id="prev-btn">←</button>
                    <span class="cal__month" id="month-label">—</span>
                    <button type="button" class="btn-secondary" id="next-btn">→</button>
                    <button type="button" class="btn-secondary" id="today-btn">Today</button>
                </div>
            </div>

            <section class="panel">
                <div class="cal" id="calendar"></div>

                <div class="cal__legend">
                    <span class="cal__legend-item"><span class="cal__dot is-completed"></span> Completed</span>
                    <span class="cal__legend-item"><span class="cal__dot is-partial"></span> Partial</span>
                    <span class="cal__legend-item"><span class="cal__dot is-missed"></span> Missed</span>
                    <span class="cal__legend-item"><span class="cal__dot is-empty"></span> No log</span>
                </div>
            </section>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/calendar.js"></script>
</body>
</html>
