<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — HabbitTracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app">

    <aside class="app__sidebar">
        <div class="app__brand">HabbitTracker</div>

        <nav class="app__nav">
            <a href="/pages/dashboard.html" class="app__nav-item is-active">Dashboard</a>
            <a href="/pages/habits.html" class="app__nav-item">My Habits</a>
            <a href="/pages/tracking.html" class="app__nav-item">Daily Tracking</a>
            <a href="/pages/calendar.html" class="app__nav-item">Calendar</a>
            <a href="/pages/statistics.html" class="app__nav-item">Statistics</a>
            <a href="/pages/reflections.html" class="app__nav-item">Reflections</a>
            <a href="/pages/settings.html" class="app__nav-item">Settings</a>
        </nav>

        <button type="button" class="app__logout" id="logout-btn">Logout</button>
    </aside>

    <main class="app__main">
        <header class="app__header">
            <h1 class="app__page-title">Dashboard</h1>
            <div class="app__user" id="user-name">—</div>
        </header>

        <div class="app__content">
            <h2 class="app__welcome" id="welcome">Welcome back</h2>

            <!-- Summary cards -->
            <section class="cards" id="summary-cards">
                <div class="card">
                    <div class="card__label">Active Habits</div>
                    <div class="card__value" id="stat-active">—</div>
                </div>
                <div class="card">
                    <div class="card__label">Today's Progress</div>
                    <div class="card__value" id="stat-today">—</div>
                </div>
                <div class="card">
                    <div class="card__label">Current Streak</div>
                    <div class="card__value" id="stat-streak">—</div>
                </div>
                <div class="card">
                    <div class="card__label">This Week</div>
                    <div class="card__value" id="stat-week">—</div>
                </div>
            </section>

            <!-- Today's Habits (hero) -->
            <section class="panel">
                <h3 class="panel__title">Today's Habits</h3>
                <div id="today-habits" class="stack"></div>
            </section>

            <!-- Weekly Performance + Recent Activity (two-column) -->
            <div class="dash__grid">
                <section class="panel">
                    <h3 class="panel__title">Weekly Performance</h3>
                    <div id="weekly-chart" class="chart"></div>
                </section>

                <section class="panel">
                    <h3 class="panel__title">Recent Activity</h3>
                    <div id="recent-activity"></div>
                </section>
            </div>

            <!-- Habit Performance -->
            <section class="panel">
                <h3 class="panel__title">Habit Performance</h3>
                <div id="habit-performance" class="stack"></div>
            </section>
            
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
