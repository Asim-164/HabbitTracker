<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabbitTracker — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth">

    <div class="auth__card">

        <div class="auth__form-panel">
            <form id="login-form" class="auth__form">
                <h2 class="auth__title">Sign In</h2>
                <p class="auth__sub muted small">Welcome back. Log in to continue.</p>

                <input type="email" name="email" placeholder="Email" required autocomplete="email">
                <input type="password" name="password" placeholder="Password" required autocomplete="current-password">

                <button type="submit" class="auth__submit">Sign In</button>
                <p class="auth__msg" id="login-msg"></p>
            </form>

            <form id="register-form" class="auth__form" hidden>
                <h2 class="auth__title">Create Account</h2>
                <p class="auth__sub muted small">Start tracking how you perform, not just whether you did it. </p>

                <input type="text" name="name" placeholder="Name" required autocomplete="name">
                <input type="email" name="email" placeholder="Email" required autocomplete="email">
                <input type="password" name="password" placeholder="Password" required autocomplete="new-password" minlength="6">

                <button type="submit" class="auth__submit">Create Account</button>
                <p class="auth__msg" id="register-msg"></p>
            </form>
        </div>

        <aside class="auth__brand-panel">
            <div class="auth__brand">HabbitTracker</div>

            <div class="auth__brand-body">
                <h2 class="auth__brand-headline" id="brand-headline">Good to see you again!</h2>
                <p class="auth__brand-sub" id="brand-sub">Small steps, every day. Let's keep the streak alive.</p>
            </div>

            <button type="button" class="auth__switch" id="switch-btn">Create Account</button>
        </aside>

    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
