<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tracking — HabbitTracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app">

    <aside class="app__sidebar">
        <div class="app__brand">HabbitTracker</div>

        <nav class="app__nav">
            <a href="/pages/dashboard.html" class="app__nav-item">Dashboard</a>
            <a href="/pages/habits.html" class="app__nav-item">My Habits</a>
            <a href="/pages/tracking.html" class="app__nav-item is-active">Daily Tracking</a>
            <a href="/pages/calendar.html" class="app__nav-item">Calendar</a>
            <a href="/pages/statistics.html" class="app__nav-item">Statistics</a>
            <a href="/pages/reflections.html" class="app__nav-item">Reflections</a>
            <a href="/pages/settings.html" class="app__nav-item">Settings</a>
        </nav>

        <button type="button" class="app__logout" id="logout-btn">Logout</button>
    </aside>

    <main class="app__main">
        <header class="app__header">
            <h1 class="app__page-title">Daily Tracking</h1>
            <div class="app__user" id="user-name">—</div>
        </header>

        <div class="app__content">
            <div class="tracking__head">
                <label class="tracking__date-label">
                    <span class="muted small">Date</span>
                    <input type="date" id="tracking-date" class="tracking__date">
                </label>
            </div>

            <section class="panel">
                <h3 class="panel__title">Habits</h3>
                <div id="tracking-list" class="stack"></div>
            </section>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/tracking.js"></script>
</body>
</html>
