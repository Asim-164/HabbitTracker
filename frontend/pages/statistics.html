<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics — HabbitTracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app">

    <aside class="app__sidebar">
        <div class="app__brand" style="display: flex; align-items: center; gap: 10px;">
            <img src="/assets/logo.png" alt="Logo" style="width: 24px; height: 24px; border-radius: 6px; object-fit: contain;">
            HabbitTracker
        </div>

        <nav class="app__nav">
            <a href="/pages/dashboard.html" class="app__nav-item">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Dashboard
            </a>
            <a href="/pages/habits.html" class="app__nav-item">
                <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                My Habits
            </a>
            <a href="/pages/tracking.html" class="app__nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
                Daily Tracking
            </a>
            <a href="/pages/calendar.html" class="app__nav-item">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Calendar
            </a>
            <a href="/pages/statistics.html" class="app__nav-item is-active">
                <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                Statistics
            </a>
            <a href="/pages/reflections.html" class="app__nav-item">
                <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                Reflections
            </a>
            <a href="/pages/settings.html" class="app__nav-item">
                <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
                Settings
            </a>
        </nav>

        <button type="button" class="app__logout" id="logout-btn">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
        </button>
    </aside>

    <main class="app__main">
        <header class="app__header">
            <div class="app__header-left">
                <span class="app__header-icon">
                    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                </span>
                <h1 class="app__page-title">Statistics</h1>
            </div>
            <div class="app__user">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span id="user-name">—</span>
            </div>
        </header>

        <div class="app__content">

            <!-- Summary (last 7 days) -->
            <section class="panel">
                <h3 class="panel__title">Last 7 Days</h3>
                <div class="stats__summary" id="summary-block">
                    <p class="muted small">Loading…</p>
                </div>
            </section>

            <!-- Report -->
            <section class="panel">
                <div class="stats__head">
                    <h3 class="panel__title">Performance over time</h3>
                    <div class="stats__controls">
                        <div class="habits__tabs">
                            <button type="button" class="tab is-active" data-group="week">Weekly</button>
                            <button type="button" class="tab" data-group="month">Monthly</button>
                        </div>
                        <select id="periods-select">
                            <option value="4">4 periods</option>
                            <option value="8" selected>8 periods</option>
                            <option value="12">12 periods</option>
                            <option value="26">26 periods</option>
                        </select>
                    </div>
                </div>
                <div id="report-block">
                    <p class="muted small">Loading…</p>
                </div>
            </section>

            <!-- Per-habit table -->
            <section class="panel">
                <h3 class="panel__title">Per-Habit Breakdown</h3>
                <div id="table-block">
                    <p class="muted small">Loading…</p>
                </div>
            </section>

        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/statistics.js"></script>
</body>
</html>
