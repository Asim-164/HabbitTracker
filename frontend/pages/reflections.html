<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflections — HabbitTracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app">

    <aside class="app__sidebar">
        <div class="app__brand" style="display: flex; align-items: center; gap: 10px;">
            <img src="/assets/logo.png" alt="Logo" style="width: 24px; height: 24px; border-radius: 6px; object-fit: contain;">
            HabbitTracker
        </div>

        <nav class="app__nav">
            <a href="/pages/dashboard.html" class="app__nav-item">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Dashboard
            </a>
            <a href="/pages/habits.html" class="app__nav-item">
                <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                My Habits
            </a>
            <a href="/pages/tracking.html" class="app__nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
                Daily Tracking
            </a>
            <a href="/pages/calendar.html" class="app__nav-item">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Calendar
            </a>
            <a href="/pages/statistics.html" class="app__nav-item">
                <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                Statistics
            </a>
            <a href="/pages/reflections.html" class="app__nav-item is-active">
                <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                Reflections
            </a>
            <a href="/pages/settings.html" class="app__nav-item">
                <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
                Settings
            </a>
        </nav>

        <button type="button" class="app__logout" id="logout-btn">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Logout
        </button>
    </aside>

    <main class="app__main">
        <header class="app__header">
            <div class="app__header-left">
                <span class="app__header-icon">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                </span>
                <h1 class="app__page-title">Reflections</h1>
            </div>

            <div class="app__search" id="app-search">
                <svg viewBox="0 0 24 24" class="app__search-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" class="app__search-input" id="search-input" placeholder="Search habits or notes..." autocomplete="off">
                <div class="app__search-results" id="search-results" hidden></div>
            </div>

            <div class="app__user">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span id="user-name">—</span>
            </div>
        </header>

        <div class="app__content">

            <!-- Mood strip -->
            <section class="panel mood-strip">
                <div class="mood-strip__head">
                    <h3 class="panel__title">Mood this month</h3>
                    <span class="muted small" id="mood-month">—</span>
                </div>
                <div class="mood-strip__dots" id="mood-dots"></div>
                <div class="mood-strip__legend">
                    <span class="mood-legend"><span class="mood-dot is-great"></span> Great</span>
                    <span class="mood-legend"><span class="mood-dot is-good"></span> Good</span>
                    <span class="mood-legend"><span class="mood-dot is-okay"></span> Okay</span>
                    <span class="mood-legend"><span class="mood-dot is-meh"></span> Meh</span>
                    <span class="mood-legend"><span class="mood-dot is-bad"></span> Bad</span>
                    <span class="mood-legend"><span class="mood-dot is-none"></span> No entry</span>
                </div>
            </section>

            <div class="habits__head">
                <p class="muted small">A short daily note about how things are going.</p>
                <button type="button" class="btn-primary" id="new-reflection-btn">New Reflection</button>
            </div>

            <section class="panel">
                <div id="reflections-list" class="stack"></div>
            </section>
        </div>
    </main>

    <!-- New Reflection modal -->
    <div class="modal" id="reflection-modal" hidden>
        <div class="modal__backdrop" data-close></div>
        <div class="modal__box">
            <h3 class="modal__title">New Reflection</h3>

            <form id="reflection-form" class="habit-form">
                <label class="habit-form__field">
                    <span>Date</span>
                    <input type="date" name="date" required>
                </label>

                <label class="habit-form__field">
                    <span>Mood</span>
                    <select name="mood" required>
                        <option value="">Choose…</option>
                        <option value="Bad">😞 Bad</option>
                        <option value="Meh">😕 Meh</option>
                        <option value="Okay">😐 Okay</option>
                        <option value="Good">🙂 Good</option>
                        <option value="Great">😄 Great</option>
                    </select>
                </label>

                <label class="habit-form__field">
                    <span>Notes</span>
                    <textarea name="notes" rows="4" maxlength="1000" placeholder="How did today go?"></textarea>
                </label>

                <div class="habit-form__actions">
                    <button type="button" class="btn-secondary" data-close>Cancel</button>
                    <button type="submit" class="btn-primary">Save</button>
                </div>
                <p class="habit-form__msg" id="reflection-msg"></p>
            </form>
        </div>
    </div>
    <!-- Confirm dialog -->
    <div class="modal" id="confirm-modal" hidden>
        <div class="modal__backdrop" data-confirm-cancel></div>
        <div class="modal__box modal__box--sm">
            <h3 class="modal__title" id="confirm-title">Are you sure?</h3>
            <p class="muted" id="confirm-message" style="margin-bottom: var(--space-5);">This action cannot be undone.</p>
            <div class="habit-form__actions">
                <button type="button" class="btn-secondary" data-confirm-cancel>Cancel</button>
                <button type="button" class="btn-danger" id="confirm-ok">Delete</button>
            </div>
        </div>
    </div>
    
    <script src="/js/api.js"></script>
    <script src="/js/reflections.js"></script>
</body>
</html>
